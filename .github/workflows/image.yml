name: Docker Image Build and Push

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/jo-jun83/holbertonschool-continuous_integrations:${{ github.sha }} \
            -t ghcr.io/jo-jun83/holbertonschool-continuous_integrations:latest \
            .

      - name: Push Docker image
        run: |
          docker push ghcr.io/jo-jun83/holbertonschool-continuous_integrations:${{ github.sha }}
          docker push ghcr.io/jo-jun83/holbertonschool-continuous_integrations:latest